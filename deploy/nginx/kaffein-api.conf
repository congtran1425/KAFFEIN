# First obtain the certificate using an HTTP-only vhost and the same webroot.
server {
    listen 80;
    listen [::]:80;
    server_name api-kaffein.congtc145.id.vn;
    location /.well-known/acme-challenge/ {
        root /var/www/kaffein-acme;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api-kaffein.congtc145.id.vn;
    ssl_certificate /etc/letsencrypt/live/api-kaffein.congtc145.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-kaffein.congtc145.id.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:KAFFEIN_SSL:10m;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://127.0.0.1:3082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        client_max_body_size 2m;
    }
}
