name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, desktop-work]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: kaffein_ci_e2e
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:synthetic-ci-only@127.0.0.1:5432/kaffein_ci_e2e
      POS_E2E_ALLOW_DB_WRITE: YES_I_ACCEPT_DB_MUTATION
      NODE_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate -w api
      - run: npm run lint -w api
      - run: npm run test -w api -- --runInBand
      - run: npm run build -w api
      - run: npm run db:deploy -w api
      - run: npm run test:e2e -w api
      - run: node scripts/test-container-bootstrap.mjs && node scripts/test-prisma-cloud-config.mjs

  web-infra:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://build:build@localhost:5432/build
      VITE_API_BASE_URL: https://api-aws.congtc145.id.vn/api/v1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint -w web
      - run: npm run test -w web
      - run: npm run build -w web
      - run: npm run test -w infra
      - run: npm run synth -w infra -- --quiet
      - run: node --test scripts/aws-release.test.mjs

  pos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - run: rm -f apps/pos/local.properties && chmod +x apps/pos/gradlew
      - working-directory: apps/pos
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kaffein-pos-aws-${{ github.sha }}
          path: apps/pos/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
