services:
  postgres:
    image: postgres:17-alpine
    container_name: kaffein-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coffee_pos}
      POSTGRES_USER: ${POSTGRES_USER:-coffee_pos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coffee_pos} -d ${POSTGRES_DB:-coffee_pos}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
